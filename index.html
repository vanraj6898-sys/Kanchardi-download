<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanchardi High School - Official App</title>
  
  <!-- FontAwesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #0b0f19;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      color: #fff;
      padding: 20px;
    }

    /* Ambient Glowing Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      opacity: 0.6;
      animation: floatOrb 8s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #3b82f6, #1d4ed8);
      top: -50px;
      left: -50px;
    }

    .orb-2 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, #8b5cf6, #6d28d9);
      bottom: -60px;
      right: -60px;
      animation-duration: 10s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 40px) scale(1.15); }
    }

    /* Floating Study Icons */
    .floating-icon {
      position: absolute;
      color: rgba(255, 255, 255, 0.08);
      font-size: 2.5rem;
      z-index: 0;
      animation: floatItem 6s ease-in-out infinite;
    }

    .fi-1 { top: 15%; left: 12%; animation-delay: 0s; }
    .fi-2 { top: 75%; left: 10%; animation-delay: 2s; }
    .fi-3 { top: 20%; right: 12%; animation-delay: 1.5s; }
    .fi-4 { top: 70%; right: 15%; animation-delay: 3s; }

    @keyframes floatItem {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(12deg); }
    }

    /* Main 3D Card */
    .card-container {
      position: relative;
      z-index: 10;
      perspective: 1000px;
      width: 100%;
      max-width: 440px;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
    }

    /* App Icon */
    .app-icon-wrapper {
      position: relative;
      width: 85px;
      height: 85px;
      margin: 0 auto 18px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: white;
      box-shadow: 0 15px 35px rgba(59, 130, 246, 0.4);
      transform: translateZ(40px);
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      transform: translateZ(30px);
    }

    .badge {
      display: inline-block;
      background: rgba(59, 130, 246, 0.18);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #60a5fa;
      padding: 4px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 50px;
      margin-bottom: 15px;
      transform: translateZ(25px);
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 25px;
      line-height: 1.5;
      transform: translateZ(20px);
    }

    /* Glowing 3D Button */
    .download-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      text-decoration: none;
      padding: 16px 28px;
      border-radius: 18px;
      font-size: 1.05rem;
      font-weight: 600;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.35);
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform: translateZ(35px);
      cursor: pointer;
    }

    .download-btn:hover {
      transform: translateZ(45px) scale(1.03);
      box-shadow: 0 18px 40px rgba(124, 58, 237, 0.55);
    }

    .download-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: linear-gradient(
        60deg,
        rgba(255, 255, 255, 0) 20%,
        rgba(255, 255, 255, 0.35) 50%,
        rgba(255, 255, 255, 0) 80%
      );
      transform: rotate(25deg);
      animation: buttonShine 4s infinite;
    }

    @keyframes buttonShine {
      0% { left: -60%; }
      30%, 100% { left: 140%; }
    }

    /* Specs Footer */
    .specs-grid {
      display: flex;
      justify-content: space-around;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      transform: translateZ(20px);
    }

    .spec-item {
      text-align: center;
    }

    .spec-item span {
      display: block;
      font-size: 0.72rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .spec-item strong {
      font-size: 0.85rem;
      color: #cbd5e1;
    }
  </style>
</head>
